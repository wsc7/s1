{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>删除部门 - {{ department.name }}</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <style>
    body { background-color: #f5f6fa; }
    .page-wrap { max-width: 720px; margin: 2rem auto; }
  </style>
</head>
<body>
  <nav class="navbar navbar-inverse">
    <div class="container">
      <a class="navbar-brand" href="{% url 'departments' %}">← 返回部门管理</a>
    </div>
  </nav>

  <div class="container page-wrap">
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">确认删除部门</h4>
      </div>
      <div class="card-body">
        <div class="alert alert-warning">
          <h5>您确定要删除以下部门吗？</h5>
        </div>

        <div class="well">
          <h5>部门信息</h5>
          <p><strong>部门名称：</strong>{{ department.name }}</p>
          <p><strong>描述：</strong>{{ department.description|default:"—" }}</p>
          <p><strong>创建时间：</strong>{{ department.created_at|date:"Y-m-d H:i" }}</p>
          <p><strong>更新时间：</strong>{{ department.updated_at|date:"Y-m-d H:i" }}</p>
        </div>

        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <button type="submit" class="btn btn-danger">确认删除</button>
            <a href="{% url 'departments' %}" class="btn btn-default">取消</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
</html>
