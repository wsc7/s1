{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新建会议</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <style>
    body { background-color: #f5f6fa; }
    .page-wrap { max-width: 800px; margin: 2rem auto; }
  </style>
</head>
<body>
  <nav class="navbar navbar-inverse">
    <div class="container">
      <a class="navbar-brand" href="{% url 'meetings' %}">← 返回会议管理</a>
    </div>
  </nav>

  <div class="container page-wrap">
    <h3 class="page-header">新建会议</h3>
    <p class="text-muted">请填写开始/结束时间（必填），保存后将写入数据库。</p>

    <form method="post" class="form-horizontal">
      {% csrf_token %}
      {% if form.non_field_errors %}
      <div class="alert alert-danger">{{ form.non_field_errors }}</div>
      {% endif %}
      {% for field in form %}
      <div class="form-group{% if field.errors %} has-error{% endif %}">
        <label class="col-sm-3 control-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <div class="col-sm-9">
          {{ field }}
          {% if field.errors %}
          <span class="help-block">{{ field.errors|striptags }}</span>
          {% endif %}
        </div>
      </div>
      {% endfor %}
      <div class="form-group">
        <div class="col-sm-offset-3 col-sm-9">
          <button type="submit" class="btn btn-primary">保存</button>
          <a href="{% url 'meetings' %}" class="btn btn-default">取消</a>
        </div>
      </div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
</html>
