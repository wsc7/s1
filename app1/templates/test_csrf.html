{% extends "meeting-system-base.html" %}

{% block title %}CSRF Test{% endblock %}

{% block content %}
    <div class="container" style="margin-top: 2rem; max-width: 720px;">
        <div class="page-header">
            <h3>CSRF Test Page</h3>
        </div>

        <form method="post" action="/login/" class="form-inline">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="Username">
            </div>
            <div class="form-group" style="margin-left: 8px;">
                <input type="password" name="password" class="form-control" placeholder="Password">
            </div>
            <button type="submit" class="btn btn-default" style="margin-left: 8px;">Test Login</button>
        </form>

        <p style="margin-top: 1rem;">CSRF Token: {{ csrf_token }}</p>
    </div>
{% endblock %}
